name: Deploy to Firebase Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy to Firebase Staging
        run: npx firebase-tools deploy --only hosting:staging --non-interactive --token "${{ secrets.FIREBASE_TOKEN }}"